<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <title>broski</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="broski" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/montserrat.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/local-web-broski.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <span class="top-spacer" aria-hidden="true"></span>
        <h1 class="title">
          <button
            id="switch"
            class="switch"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="chats"
          >
            <span id="chat-name">broski</span>
            <span id="status-dot" class="status-dot" data-state="down" role="status" aria-label="Connecting"></span>
            <svg
              class="chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m7 10 5 5 5-5" />
            </svg>
          </button>
        </h1>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch theme">
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
          </svg>
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
          </svg>
        </button>
      </div>
      <nav id="chats" class="chats" aria-label="Chats" hidden></nav>
    </header>
    <div id="scrim" class="scrim" hidden></div>

    <main id="scroller" class="scroller">
      <div class="column">
        <button id="older" class="older" type="button" hidden>Load earlier messages</button>
        <section id="log" class="log" role="log" aria-live="polite" aria-label="Chat with broski"></section>
        <div id="working" class="working" hidden>
          <span class="working-text" id="working-text">Thinking</span>
          <span class="working-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
      </div>
    </main>

    <button id="jump" class="jump" type="button" aria-label="Scroll to latest" hidden>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M6 13l6 6 6-6" />
      </svg>
    </button>

    <section id="routines" class="routines" aria-label="Routines" hidden>
      <div class="routines-head">
        <h2>Routines</h2>
        <button id="routines-close" class="icon-btn" type="button" aria-label="Close">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="routines-list" class="routines-list"></div>
    </section>

    <footer class="dock">
      <div class="column">
        <form id="composer" class="composer">
          <label class="sr-only" for="input">Message broski</label>
          <textarea
            id="input"
            rows="1"
            maxlength="8000"
            placeholder="Ask broski anything"
            autocomplete="off"
            enterkeyhint="enter"
          ></textarea>
          <button id="send" class="send" type="submit" aria-label="Send" disabled>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" />
            </svg>
          </button>
        </form>
        <p id="archive-note" class="archive-note" hidden>Imported from Grok. This chat is read-only.</p>
      </div>
    </footer>

    <script src="/local-web-broski.js" type="module"></script>
  </body>
</html>
